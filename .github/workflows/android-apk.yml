name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download APK artifact
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' eas-build.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "EAS did not return an APK download URL"
            cat eas-build.json
            exit 1
          fi
          curl --fail --location "$url" --output "LearningEnglishApp-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LearningEnglishApp-*.apk
          generate_release_notes: true
